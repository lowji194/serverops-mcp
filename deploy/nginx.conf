# ServerOps MCP — Nginx Reverse Proxy Template
# Replace mcp.example.com and certificate paths with your actual domain and TLS certificates.

upstream serverops_backend {
    server 127.0.0.1:8790;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=serverops_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=serverops_api:10m rate=60r/m;

server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    # SSL Configuration (Use strong modern ciphers)
    ssl_certificate /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Strict Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Max body size for deployment payloads and files
    client_max_body_size 64M;

    # OAuth Authorization Endpoint (With rate limiting)
    location /oauth/authorize {
        limit_req zone=serverops_auth burst=5 nodelay;
        proxy_pass http://serverops_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP SSE & Streamable HTTP Transport
    location /mcp {
        proxy_pass http://serverops_backend;
        proxy_http_version 1.1;

        # Disable buffering for SSE (Server-Sent Events) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API & Discovery Endpoints
    location / {
        limit_req zone=serverops_api burst=20 nodelay;
        proxy_pass http://serverops_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
